[project]
name = "wb-tool"
version = "0.3.0"
description = "WorkBuddy（国际版）会话工具箱：导出/导入会话、改会话工作目录、把会话归属账号改写为当前登录账号"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
wb-tool = "wb_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wb_tool"]

[tool.uv]
package = true
