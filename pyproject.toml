[project]
name = "wd-move"
version = "0.1.0"
description = "WorkBuddy（国际版）会话迁移工具：导出/导入全部会话，并把会话归属账号改写为最新登录账号"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
wd-move = "wd_move.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wd_move"]

[tool.uv]
package = true
